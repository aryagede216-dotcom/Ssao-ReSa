name: build-dylib

on:
  workflow_dispatch:
  push:
    paths:
      - "ssao_resa.m"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile ssao_resa.dylib (iOS arm64)
        run: |
          xcrun --sdk iphoneos clang \
            -arch arm64 -miphoneos-version-min=13.0 \
            -dynamiclib -fobjc-arc -O2 \
            -DGLES_SILENCE_DEPRECATION \
            -framework Foundation -framework OpenGLES \
            -install_name @rpath/ssao_resa.dylib \
            -o ssao_resa.dylib ssao_resa.m
          file ssao_resa.dylib
          lipo -info ssao_resa.dylib
          nm -gU ssao_resa.dylib | grep ssao_

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: ssao_resa-dylib
          path: ssao_resa.dylib
